name: Build WordCommentsAnalyzer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        framework: [v4.5.2, v4.7.2]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2
      with:
        nuget-version: latest

    - name: Restore NuGet packages
      run: |
        nuget restore WordCommentsAnalyzer/WordCommentsAnalyzer.csproj `
          -PackagesDirectory packages

    - name: Build
      run: |
        msbuild "WordCommentsAnalyzer/WordCommentsAnalyzer.csproj" `
          /p:Configuration=Release `
          /p:Platform="Any CPU" `
          /p:TargetFrameworkVersion=${{ matrix.framework }} `
          /p:OutputPath="..\bin\Release-${{ matrix.framework }}" `
          /p:RestorePackages=false `
          /p:AutoGenerateBindingRedirects=true `
          /p:GenerateBindingRedirectsOutputType=true

    - name: Check build
      run: |
        $dir = "bin\Release-${{ matrix.framework }}"
        $exe = "$dir\WordCommentsAnalyzer.exe"

        if (Test-Path $exe) {
          echo "Build successful: $exe"
        } else {
          echo "Build failed: $exe not found"
          exit 1
        }

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: WordCommentsAnalyzer-${{ matrix.framework }}
        path: bin/Release-${{ matrix.framework }}/
        retention-days: 30
