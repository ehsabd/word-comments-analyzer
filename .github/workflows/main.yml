name: Build WordCommentsAnalyzer .NET Framework 4.5.2 WinForms

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET Framework
      uses: microsoft/setup-msbuild@v1.1

    - name: Setup NuGet
      uses: nuget/setup-nuget@v1
      with:
        nuget-version: 'latest'

    - name: Restore NuGet packages for specific project
      run: |
        nuget restore WordCommentsAnalyzer/WordCommentsAnalyzer.csproj -PackagesDirectory packages

    - name: Build only WordCommentsAnalyzer project
      run: |
        msbuild "WordCommentsAnalyzer/WordCommentsAnalyzer.csproj" /p:Configuration=Release /p:Platform="Any CPU" /p:TargetFrameworkVersion=v4.5.2 /p:OutputPath=..\bin\Release /p:RestorePackages=false /p:AutoGenerateBindingRedirects=true /p:GenerateBindingRedirectsOutputType=true
    
    - name: Check if build succeeded
      id: build_check
      run: |
        if (Test-Path "bin\Release\WordCommentsAnalyzer.exe") {
          echo "Build successful - WordCommentsAnalyzer.exe found"
        } else {
          echo "❌ Build failed - WordCommentsAnalyzer.exe not found"
          exit 1
        }
    
    - name: Create app.config with .NET Framework requirement
      run: |
        # Ensure app.config exists with framework requirement
        if (-not (Test-Path "bin\Release\WordCommentsAnalyzer.exe.config")) {
          $configContent = @"
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <startup>
            <supportedRuntime version="v4.0" sku=".NETFramework,Version=v4.5.2"/>
          </startup>
        </configuration>
        "@
          $configContent | Out-File -FilePath "bin\Release\WordCommentsAnalyzer.exe.config" -Encoding UTF8
          echo "Created app.config with .NET Framework 4.5.2 requirement"
        } else {
          echo "app.config already exists"
        }
    
    - name: Download .NET Framework redistributable
      run: |
        # Download .NET Framework 4.5.2 redistributable
        $netfxUrl = "https://download.microsoft.com/download/E/2/1/E21644B5-2DF2-47C2-91BD-63C560427900/NDP452-KB2901907-x86-x64-AllOS-ENU.exe"
        $outputPath = "bin\Release\dotnetfx452.exe"
        try {
          Invoke-WebRequest -Uri $netfxUrl -OutFile $outputPath
          echo "✅ .NET Framework 4.5.2 redistributable included"
        } catch {
          echo "⚠️  Failed to download .NET Framework redistributable, continuing without it"
        }
    
    - name: Create deployment package
      run: |
        # Create deployment folder
        New-Item -ItemType Directory -Path "Deployment" -Force
        
        # Copy all build outputs
        Copy-Item "bin\Release\*" -Destination "Deployment\" -Recurse
        
        # Create installer script
        $installScript = @"
        @echo off
        title WordCommentsAnalyzer Setup
        echo Checking for .NET Framework 4.5.2...
        
        reg query "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full" /v Release | find "379893" >nul
        if %errorlevel% equ 0 (
          echo .NET Framework 4.5.2 is installed.
          echo Starting WordCommentsAnalyzer...
          WordCommentsAnalyzer.exe
          exit /b 0
        )
        
        echo .NET Framework 4.5.2 not found.
        echo Would you like to install it now? (Y/N)
        set /p choice=
        if /i "%choice%" neq "Y" (
          echo Installation cancelled.
          pause
          exit /b 1
        )
        
        echo Installing .NET Framework 4.5.2...
        dotnetfx452.exe /quiet /norestart
        echo Installation started. Please wait for completion and then run WordCommentsAnalyzer.exe
        pause
        "@
        
        $installScript | Out-File -FilePath "Deployment\InstallAndRun.bat" -Encoding ascii
        echo "✅ Deployment package created"
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: WordCommentsAnalyzer
        path: |
          bin/Release/
          Deployment/
        retention-days: 30
